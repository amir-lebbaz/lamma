name: Build Native Android APK (لَمّة)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble & Sign Lamma Native APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          validate-wrappers: false

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Official Gradle Wrapper
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Release APK with Gradle
        working-directory: android-app
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Copy & Name APK Artifact
        run: |
          mkdir -p build-output
          find android-app/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/lamma.apk \;
          echo "Generated APK size and details:"
          ls -lh build-output/lamma.apk

      - name: Upload Native Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lamma-native-apk
          path: build-output/lamma.apk
          if-no-files-found: error
          retention-days: 30
